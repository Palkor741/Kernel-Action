name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    - name: Setup Configuration
      run: |
        echo "KERNEL_SOURCE=$(cat config.env | grep "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat config.env | grep "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_DEFCONFIG=$(cat config.env | grep "KERNEL_DEFCONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "TARGET_ARCH=$(cat config.env | grep "TARGET_ARCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_FILE=$(cat config.env | grep "KERNEL_FILE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_VERSION=$(cat config.env | grep "CLANG_VERSION" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "BUILD_EXTRA_COMMAND=$(cat config.env | grep "EXTRA_BUILD_COMMAND" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
        echo "DISABLE-LTO=$(cat config.env | grep "DISABLE-LTO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_KERNELSU=$(cat config.env | grep "USE_KERNELSU" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "NEED_DTBO=$(cat config.env | grep "NEED_DTBO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "MAKE_BOOT_IMAGE=$(cat config.env | grep "MAKE_BOOT_IMAGE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "SOURCE_BOOT_IMAGE=$(cat config.env | grep "SOURCE_BOOT_IMAGE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_DEFCONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang Toolchain
      run: |
        mkdir clang
        git clone https://github.com/vijaymalav564/vortex-clang.git -b master --depth=1 clang

    - name: Download mkbootimg tools
      if: env.MAKE_BOOT_IMAGE == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1
        mkdir gcc-aosp
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/606f80986096476912e04e5c2913685a8f2c3b65.tar.gz
        tar -C gcc-aosp/ -zxvf 606f80986096476912e04e5c2913685a8f2c3b65.tar.gz

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Download source boot image
      if: env.MAKE_BOOT_IMAGE == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget -O boot-source.img ${{ env.SOURCE_BOOT_IMAGE }}
        if [ -f boot-source.img ]; then
            echo "FORMAT_MKBOOTING=$(echo `tools/unpack_bootimg.py --boot_img=boot-source.img --format mkbootimg`)" >> $GITHUB_ENV
            echo "HAVE_SOURCE_BOOT_IMAGE=true" >> $GITHUB_ENV
        else
            echo "Source boot image is empty"
        fi

    - name: Set custom kernel name
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        sed -i '/CONFIG_LOCALVERSION=/d' arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo 'CONFIG_LOCALVERSION="-Valcore"' >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}

    - name: Setup KernelSU-Next source
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        echo "CONFIG_KSU=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}

    - name: Patch fs/exec.c for KernelSU-Next
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="fs/exec.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,'
          printf '%s\n' '                              void *argv, void *envp, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);'
          printf '%s\n' '#endif'
        } > /tmp/patch2.txt

        awk -v patchfile="/tmp/patch1.txt" '
          /^int do_execve\(struct filename \*filename,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/exec_step1.c
        mv /tmp/exec_step1.c "$FILE"

        awk -v patchfile="/tmp/patch2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};/ &&
                  lines[i+1] ~ /struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};/ &&
                  lines[i+2] ~ /return do_execveat_common/) {
                print lines[i+1]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                i++
              }
            }
          }
        ' "$FILE" > /tmp/exec_step2.c
        mv /tmp/exec_step2.c "$FILE"

    - name: Patch fs/open.c for KernelSU-Next
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="fs/open.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *mode, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_faccessat(&dfd, &filename, &mode, NULL);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open2.txt

        awk -v patchfile="/tmp/patch_open1.txt" '
          /^SYSCALL_DEFINE3\(faccessat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/open_step1.c
        mv /tmp/open_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_open2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /unsigned int lookup_flags = LOOKUP_FOLLOW;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(mode & ~S_IRWXO\)/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
              }
            }
          }
        ' "$FILE" > /tmp/open_step2.c
        mv /tmp/open_step2.c "$FILE"

    - name: Patch fs/read_write.c for KernelSU-Next
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="fs/read_write.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern bool ksu_vfs_read_hook __read_mostly;'
          printf '%s\n' '__attribute__((cold))'
          printf '%s\n' 'extern int ksu_handle_sys_read(unsigned int fd,'
          printf '%s\n' '                              char __user **buf_ptr, size_t *count_ptr);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        if (unlikely(ksu_vfs_read_hook))'
          printf '%s\n' '                ksu_handle_sys_read(fd, &buf, &count);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw2.txt

        awk -v patchfile="/tmp/patch_rw1.txt" '
          /^SYSCALL_DEFINE3\(read,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/rw_step1.c
        mv /tmp/rw_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_rw2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE3\(read,/ { target_zone = 1 }
          {
            lines[NR] = $0
            zone[NR] = target_zone
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /ssize_t ret = -EBADF;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(f\.file\) \{/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/rw_step2.c
        mv /tmp/rw_step2.c "$FILE"

    - name: Patch fs/stat.c for KernelSU-Next
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="fs/stat.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_stat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_stat(&dfd, &filename, &flag);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat2.txt

        awk -v patchfile="/tmp/patch_stat1.txt" '
          /^SYSCALL_DEFINE4\(newfstatat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/stat_step1.c
        mv /tmp/stat_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_stat2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(newfstatat,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int error;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /error = vfs_fstatat\(dfd, filename, &stat, flag\);/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/stat_step2.c
        mv /tmp/stat_step2.c "$FILE"

    - name: Patch kernel/reboot.c for KernelSU-Next
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="kernel/reboot.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot2.txt

        awk -v patchfile="/tmp/patch_reboot1.txt" '
          /^SYSCALL_DEFINE4\(reboot,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/reboot_step1.c
        mv /tmp/reboot_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_reboot2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(reboot,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int ret = 0;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /We only trust the superuser/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/reboot_step2.c
        mv /tmp/reboot_step2.c "$FILE"

    - name: Patch nt36xxx.c for MediaTek panel touch handle
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        FILE="drivers/input/touchscreen/NT36672C/nt36xxx.c"

        {
          printf '%s\n' '#ifdef CONFIG_DRM_MEDIATEK'
          printf '%s\n' 'static int nvt_tp_power_on_reinit(void)'
          printf '%s\n' '{'
          printf '%s\n' '        int32_t ret;'
          printf '%s\n' ''
          printf '%s\n' '        pr_info("%s is called\n", __func__);'
          printf '%s\n' ''
          printf '%s\n' '        ret = nvt_ts_suspend(&ts->client->dev);'
          printf '%s\n' '        if (ret) {'
          printf '%s\n' '                pr_info("%s  is called suspend %d\n", __func__, ret);'
          printf '%s\n' '                return ret;'
          printf '%s\n' '        }'
          printf '%s\n' ''
          printf '%s\n' '        ret = nvt_ts_resume(&ts->client->dev);'
          printf '%s\n' '        if (ret)'
          printf '%s\n' '                pr_info("%s  is called resume %d\n", __func__, ret);'
          printf '%s\n' ''
          printf '%s\n' '        return ret;'
          printf '%s\n' '}'
          printf '%s\n' '#endif'
        } > /tmp/patch_touch_func.txt

        {
          printf '%s\n' '#ifdef CONFIG_DRM_MEDIATEK'
          printf '%s\n' '        pr_info("%s, disp notifier register func!\n", __func__);'
          printf '%s\n' '        if (mtk_panel_tch_handle_init()) {'
          printf '%s\n' '                void **retval = mtk_panel_tch_handle_init();'
          printf '%s\n' '                *retval = (void *)nvt_tp_power_on_reinit;'
          printf '%s\n' '        }'
          printf '%s\n' '#endif'
        } > /tmp/patch_touch_reg.txt

        awk -v patchfile="/tmp/patch_touch_func.txt" '
          /^static int32_t nvt_ts_probe\(struct spi_device \*client\)/ {
            while ((getline line < patchfile) > 0) print line
            print ""
          }
          { print }
        ' "$FILE" > /tmp/touch_step1.c
        mv /tmp/touch_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_touch_reg.txt" '
          BEGIN { done = 0 }
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (done == 0 &&
                  lines[i] ~ /bTouchIsAwake = 1;/ &&
                  lines[i+1] ~ /NVT_LOG\("end\\n"\);/ &&
                  lines[i+2] ~ /^$/ &&
                  lines[i+3] ~ /nvt_irq_enable\(true\);/) {
                print lines[i+1]
                print lines[i+2]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
                i += 2
              }
            }
          }
        ' "$FILE" > /tmp/touch_step2.c
        mv /tmp/touch_step2.c "$FILE"

    - name: Patch nvt_ts_resume in nt36xxx.c
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        python3 - << 'EOF'
        import re

        file_path = "drivers/input/touchscreen/NT36672C/nt36xxx.c"
        with open(file_path, "r") as f:
            code = f.read()

        old_pattern = r"static int32_t nvt_ts_resume\(struct device \*dev\)\n\{[\s\S]*?return 0;\n\}"

        new_block = r"""static int32_t nvt_ts_resume(struct device *dev)
        {
        	if (bTouchIsAwake) {
        		NVT_LOG("Touch is already resume\n");
        		return 0;
        	}

        	mutex_lock(&ts->lock);

        	NVT_LOG("start\n");

        #if NVT_TOUCH_SUPPORT_HW_RST
        	gpio_set_value(ts->reset_gpio, 1);
        #endif

        #if WAKEUP_GESTURE
        	disable_irq_wake(ts->client->irq);
        #else
        	nvt_irq_enable(true);
        #endif

        #if NVT_TOUCH_ESD_PROTECT
        	nvt_esd_check_enable(false);
        	irq_timer = jiffies;
        	queue_delayed_work(nvt_esd_check_wq, &nvt_esd_check_work,
        			   msecs_to_jiffies(NVT_TOUCH_ESD_CHECK_PERIOD));
        #endif				/* #if NVT_TOUCH_ESD_PROTECT */

        	bTouchIsAwake = 1;

        	mutex_unlock(&ts->lock);

        	NVT_LOG("end\n");

        	return 0;
        }"""

        updated_code = re.sub(old_pattern, lambda m: new_block, code, count=1)

        with open(file_path, "w") as f:
            f.write(updated_code)

        print("Patch nvt_ts_resume berhasil dipasang!")
        EOF

    - name: Generate kernel configuration
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=${{ env.TARGET_ARCH }}
        export SUBARCH=${{ env.TARGET_ARCH }}
        export KBUILD_COMPILER_STRING="$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
        export KBUILD_BUILD_HOST=GitHub-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        make -j$(nproc --all) O=out ARCH=${{ env.TARGET_ARCH }} CC=clang ${{ env.KERNEL_DEFCONFIG }}

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=${{ env.TARGET_ARCH }}
        export SUBARCH=${{ env.TARGET_ARCH }}
        export KBUILD_COMPILER_STRING="$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
        export KBUILD_BUILD_HOST=GitHub-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        make -j$(nproc --all) O=out ARCH=arm64 savedefconfig
        cp -f out/defconfig arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        make -j$(nproc --all) O=out ARCH=${{ env.TARGET_ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- ${{ env.BUILD_EXTRA_COMMAND }}

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/${{ env.KERNEL_FILE }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
       fi
       if [ -f android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/dtbo.img ]; then
           echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
       else
           echo "DTBO image is empty"
       fi

    - name: Make Anykernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        sed -i 's/kernel.string=ExampleKernel by osm0sis @ xda-developers/kernel.string=Valcore Kernel by Palkor741/g' AnyKernel3/anykernel.sh
        if [ ${{ env.CHECK_FILE_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/${{ env.KERNEL_FILE }} AnyKernel3/
        elif [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make boot image
      if: env.HAVE_SOURCE_BOOT_IMAGE == 'true' && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        tools/unpack_bootimg.py --boot_img boot-source.img
        cp android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/${{ env.KERNEL_FILE }} out/kernel
        tools/mkbootimg.py ${{ env.FORMAT_MKBOOTING }} -o boot.img
        if [ -f boot.img ]; then
            echo "MAKE_BOOT_IMAGE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Boot image is empty"
        fi
    
    - name: Upload ${{ env.KERNEL_FILE }}
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_FILE }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/${{ env.KERNEL_FILE }}

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*

    - name: Upload DTBO image
      if: env.CHECK_DTBO_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.TARGET_ARCH }}/boot/dtbo.img

    - name: Upload boot image
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: boot${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/boot.img
