name: Debug KSU Hooks

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Setup Configuration
      run: |
        echo "KERNEL_SOURCE=$(cat config.env | grep "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat config.env | grep "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_DEFCONFIG=$(cat config.env | grep "KERNEL_DEFCONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "TARGET_ARCH=$(cat config.env | grep "TARGET_ARCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_KERNELSU=$(cat config.env | grep "USE_KERNELSU" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
   
    - name: Clone kernel source
      run: |
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup KernelSU-Next source
      if: env.USE_KERNELSU == 'true'
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.2.0-legacy/kernel/setup.sh" | bash -s v3.2.0-legacy
        echo "CONFIG_KSU=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}

    - name: Debug hooks
      run: |
        cd android-kernel
        echo "=== list file drivers/kernelsu ==="
        find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \)

        echo ""
        echo "=== cari definisi ksu_vfs_read_hook & ksu_input_hook ==="
        grep -rn "ksu_vfs_read_hook\|ksu_input_hook" drivers/kernelsu/ || echo "TIDAK DITEMUKAN"

        echo ""
        echo "=== cek defconfig ==="
        grep -n "CONFIG_KSU" arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}

        echo ""
        echo "=== isi Makefile drivers/kernelsu ==="
        cat drivers/kernelsu/Makefile

    - name: Register kernelsu in drivers/Makefile
      if: env.USE_KERNELSU == 'true'
      run: |
        cd android-kernel
        if grep -q "kernelsu" drivers/Makefile; then
          echo "sudah terdaftar, skip"
        else
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo "berhasil ditambahkan"
        fi
        echo "=== isi akhir drivers/Makefile ==="
        tail -5 drivers/Makefile
