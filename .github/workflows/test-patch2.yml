name: Test Patch Kernel Tree

on:
  workflow_dispatch:

jobs:
  test:
    name: Diagnose KernelSU Source
    runs-on: ubuntu-22.04

    steps:
    - name: Clone kernel source (shallow)
      run: |
        git clone https://github.com/Palkor741/Sw-kernel-base.git -b shockwave-slmk android-kernel --depth=1

    - name: Setup KernelSU-Next source
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

    - name: Diagnose ksu_vfs_read_hook and ksu_input_hook
      run: |
        cd android-kernel
        echo "=== Cari definisi ksu_vfs_read_hook di seluruh source ==="
        grep -rn "ksu_vfs_read_hook" drivers/kernelsu/ || echo "TIDAK DITEMUKAN sama sekali"
        echo ""
        echo "=== Cari definisi ksu_input_hook di seluruh source ==="
        grep -rn "ksu_input_hook" drivers/kernelsu/ || echo "TIDAK DITEMUKAN sama sekali"
        echo ""
        echo "=== Isi file selinux_hide.c ==="
        find drivers/kernelsu -name "selinux_hide.c" -exec cat {} \;
        echo ""
        echo "=== Cari CONFIG terkait SUSFS/hide di Kconfig ==="
        grep -n "SUSFS\|HIDE" drivers/kernelsu/Kconfig || echo "Tidak ada config SUSFS/HIDE"

    - name: Check Makefile for ksud_integration
      run: |
        cd android-kernel
        echo "=== Isi drivers/kernelsu/Makefile ==="
        cat drivers/kernelsu/Makefile
        echo ""
        echo "=== Cek apakah runtime/ksud_integration ada di Makefile ==="
        grep -n "ksud_integration" drivers/kernelsu/Makefile || echo "TIDAK ADA DI MAKEFILE - INI PENYEBABNYA!" 

    - name: Check all kernelsu Makefiles
      run: |
        cd android-kernel
        echo "=== Cari semua file Makefile di drivers/kernelsu ==="
        find drivers/kernelsu -name "Makefile" -exec echo "--- {} ---" \; -exec cat {} \;   

    - name: Check how kernelsu is registered in drivers/Makefile
      run: |
        cd android-kernel
        echo "=== Cek baris kernelsu di drivers/Makefile ==="
        grep -n "kernelsu" drivers/Makefile
        echo ""
        echo "=== Cek isi obj-y kernelsu (kalau ada) di file lain ==="
        find drivers/kernelsu -maxdepth 1 -type f -name "*.mk" -o -name "Kbuild" 2>/dev/null
        find drivers/kernelsu -maxdepth 1    
