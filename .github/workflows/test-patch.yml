name: Test Patch KernelSU Hooks

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Patch (SukiSU susfs-main)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Load config from config.env
      run: |
        echo "KERNEL_SOURCE=$(cat config.env | grep "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat config.env | grep "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_DEFCONFIG=$(cat config.env | grep "KERNEL_DEFCONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "TARGET_ARCH=$(cat config.env | grep "TARGET_ARCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

    - name: Clone kernel source (shallow)
      run: |
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup SukiSU Ultra source (builtin)
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
        echo "CONFIG_KSU=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "# CONFIG_KPROBES is not set" >> arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}

    - name: Disable KPROBES ifdefs in KernelSU folder (non-GKI manual requirement)
      run: |
        cd android-kernel
        echo "=== File yang punya '#ifdef CONFIG_KPROBES' SEBELUM diganti ==="
        grep -rl "^#ifdef CONFIG_KPROBES" KernelSU/ 2>/dev/null || echo "(gak ada yang ketemu)"
        find KernelSU -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/^#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/' {} +
        echo ""
        echo "=== Verifikasi SETELAH diganti ==="
        grep -rn "CONFIG_KPROBES) && 0" KernelSU/ 2>/dev/null | head -20 || echo "!!! gak ada baris yang keganti - cek pattern aslinya beda?"

    - name: Debug - verify KSU integration into build system
      run: |
        cd android-kernel
        echo "=== Cek folder KernelSU ada gak ==="
        ls -la KernelSU/ 2>/dev/null || echo "!!! Folder KernelSU gak ada"
        echo ""
        echo "=== Cari SEMUA file Kconfig/Makefile yang nyebut KernelSU (whole tree) ==="
        grep -rln "KernelSU" --include="Kconfig" --include="Makefile" . 2>/dev/null || echo "!!! TIDAK ADA file Kconfig/Makefile manapun yang nyebut KernelSU"
        echo ""
        echo "=== Detail baris yang nyebut KernelSU/Kconfig ==="
        grep -rn "KernelSU/Kconfig" --include="Kconfig" . 2>/dev/null || echo "!!! TIDAK ADA baris source KernelSU/Kconfig di manapun"
        echo ""
        echo "=== Detail baris obj-\$(CONFIG_KSU) atau += KernelSU ==="
        grep -rn "KernelSU" --include="Makefile" . 2>/dev/null || echo "!!! TIDAK ADA baris Makefile manapun yang nunjuk folder KernelSU"
        echo ""
        echo "=== Isi awal KernelSU/Kconfig (punya symbol config apa) ==="
        head -20 KernelSU/Kconfig 2>/dev/null || echo "!!! KernelSU/Kconfig gak ada"
        echo ""
        echo "=== Isi awal KernelSU/Makefile ==="
        head -20 KernelSU/Makefile 2>/dev/null || echo "!!! KernelSU/Makefile gak ada"
        echo ""
        echo "=== Isi KernelSU/kernel/Makefile (folder actual source .c) ==="
        find KernelSU -maxdepth 2 -name "Makefile" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
        echo ""
        echo "=== Isi defconfig baris CONFIG_KSU ==="
        grep "CONFIG_KSU" arch/${{ env.TARGET_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }} || echo "!!! CONFIG_KSU gak ada di defconfig"
        echo ""
        echo "=== Struktur root Kconfig kernel (5 baris pertama yang ada 'source') ==="
        grep -n "^source" Kconfig | head -20

    - name: Debug - dump KSU Kconfig/Makefile for manual wiring
      run: |
        cd android-kernel
        echo "=== FULL: KernelSU/kernel/Kconfig ==="
        cat KernelSU/kernel/Kconfig 2>/dev/null || echo "!!! gak ada"
        echo ""
        echo "=== FULL: KernelSU/kernel/Makefile ==="
        cat KernelSU/kernel/Makefile 2>/dev/null || echo "!!! gak ada"
        echo ""
        echo "=== Pattern drivers/Makefile (contoh obj-\$(CONFIG_X) += lain) ==="
        grep -n "^obj-\$(CONFIG_" drivers/Makefile | head -15
        echo ""
        echo "=== Pattern drivers/Kconfig (contoh source lain) ==="
        grep -n "^source" drivers/Kconfig | head -15
        echo ""
        echo "=== Cari Kconfig.ext atau Kconfig include tambahan yang dipake kernel non-standar ==="
        find . -maxdepth 1 -iname "Kconfig*"
        echo ""
        echo "=== Isi akhir root Makefile (siapa tau ada area 'core-y +=' dsb) ==="
        grep -n "core-y\|drivers-y\|core-\$(SRCARCH)" Makefile | head -10

    - name: Manually wire KernelSU into Makefile and Kconfig
      run: |
        cd android-kernel

        echo "=== Sisip KernelSU/kernel/ ke core-y di Makefile ==="
        sed -i 's|^core-y[[:space:]]*+= kernel/ certs/ mm/ fs/ ipc/ security/ crypto/ block/|core-y\t\t+= kernel/ certs/ mm/ fs/ ipc/ security/ crypto/ block/ KernelSU/kernel/|' Makefile
        grep -n "core-y.*KernelSU" Makefile || { echo "!!! GAGAL sisip ke Makefile"; exit 1; }

        echo ""
        echo "=== Sisip source Kconfig KernelSU ke root Kconfig ==="
        if ! grep -q "KernelSU/kernel/Kconfig" Kconfig; then
          sed -i '/^source "arch\/\$SRCARCH\/Kconfig"/a source "KernelSU/kernel/Kconfig"' Kconfig
        fi
        grep -n "KernelSU/kernel/Kconfig" Kconfig || { echo "!!! GAGAL sisip ke Kconfig"; exit 1; }

        echo ""
        echo ">>> OK: KernelSU udah nempel manual ke Makefile & Kconfig"

    - name: Re-verify wiring after manual patch
      run: |
        cd android-kernel
        echo "=== core-y di Makefile sekarang ==="
        grep -n "^core-y" Makefile
        echo ""
        echo "=== source Kconfig sekarang (sekitar baris KernelSU) ==="
        grep -n -B2 -A2 "KernelSU/kernel/Kconfig" Kconfig

    - name: Create stub susfs.h (SUSFS not integrated yet)
      run: |
        cd android-kernel
        mkdir -p include/linux
        if [ ! -f include/linux/susfs.h ]; then
          touch include/linux/susfs.h
          echo ">>> stub susfs.h dibuat"
        else
          echo ">>> susfs.h udah ada, skip"
        fi

    - name: Debug - investigate 3 new compile errors
      run: |
        cd android-kernel
        echo "=== 1. Cek apakah 'fallthrough' udah didefine di kernel tree ==="
        grep -rn "define fallthrough" include/ 2>/dev/null || echo "!!! fallthrough BELUM didefine di manapun"
        echo ""
        echo "=== 2. Cari definisi ksu_selinux_hide_handle_post_fs_data ==="
        grep -rln "ksu_selinux_hide_handle_post_fs_data" KernelSU/ 2>/dev/null
        echo ""
        echo "=== 2b. Cari file selinux di folder KernelSU ==="
        find KernelSU -iname "*selinux*"
        echo ""
        echo "=== 2c. obj-y / file .c yang ke-compile via KernelSU/kernel/Makefile ==="
        find KernelSU/kernel -maxdepth 1 -name "*.c"
        grep -n "obj-y\|KSU_OBJS\|\.o " KernelSU/kernel/Makefile | head -30
        echo ""
        echo "=== 3. Isi sekitar event.c:285-295 dan :370-382 ==="
        sed -n '285,295p' KernelSU/kernel/sulog/event.c
        echo "---"
        sed -n '370,382p' KernelSU/kernel/sulog/event.c
        echo ""
        echo "=== 3b. Definisi user_arg_null_ptr dan struct user_arg_ptr ==="
        grep -rn "user_arg_null_ptr\|struct user_arg_ptr" KernelSU/ include/linux/ 2>/dev/null | head -20

    - name: Debug - check ksu.c includes
      run: |
        cd android-kernel
        echo "=== Semua #include \"...\" lokal di ksu.c ==="
        grep -n '#include "' KernelSU/kernel/ksu.c
        echo ""
        echo "=== Apakah selinux_hide.c ke-include? ==="
        grep -n "selinux_hide" KernelSU/kernel/ksu.c || echo "!!! TIDAK di-include di ksu.c"
        echo ""
        echo "=== Apakah selinux/selinux.c ke-include? ==="
        grep -n '"selinux/selinux.c"\|feature/selinux_hide.c' KernelSU/kernel/ksu.c || echo "!!! TIDAK di-include di ksu.c"

    - name: Fix 1 - define fallthrough macro fallback
      run: |
        cd android-kernel
        FILE="KernelSU/kernel/kernel_includes.h"
        if ! grep -q "define fallthrough" "$FILE"; then
          sed -i '1i #ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif' "$FILE"
        fi
        grep -n "define fallthrough" "$FILE" || { echo "!!! GAGAL nambah fallthrough"; exit 1; }
        echo ">>> OK: fallthrough macro fallback ditambahin"

    - name: Fix 3 - dereference USER_ARG_NULL pointer bug in event.c
      run: |
        cd android-kernel
        FILE="KernelSU/kernel/sulog/event.c"
        sed -i 's/ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp)/ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, *USER_ARG_NULL, gfp)/' "$FILE"
        grep -n "\*USER_ARG_NULL" "$FILE" || { echo "!!! GAGAL fix dereference"; exit 1; }
        echo ">>> OK: USER_ARG_NULL dereference difix"

    - name: Debug - check selinux_hide.c ifdef guards
      run: |
        cd android-kernel
        echo "=== Isi lengkap feature/selinux_hide.c ==="
        cat -n KernelSU/kernel/feature/selinux_hide.c
        echo ""
        echo "=== Isi feature/selinux_hide.h ==="
        cat -n KernelSU/kernel/feature/selinux_hide.h

    - name: Patch fs/exec.c
      run: |
        cd android-kernel
        FILE="fs/exec.c"
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,'
          printf '%s\n' '                              void *argv, void *envp, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch1.txt
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);'
          printf '%s\n' '#endif'
        } > /tmp/patch2.txt
        awk -v patchfile="/tmp/patch1.txt" '
          /^int do_execve\(struct filename \*filename,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/exec_step1.c
        mv /tmp/exec_step1.c "$FILE"
        awk -v patchfile="/tmp/patch2.txt" '
          { lines[NR] = $0 }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};/ &&
                  lines[i+1] ~ /struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};/ &&
                  lines[i+2] ~ /return do_execveat_common/) {
                print lines[i+1]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                i++
              }
            }
          }
        ' "$FILE" > /tmp/exec_step2.c
        mv /tmp/exec_step2.c "$FILE"

    - name: Verify fs/exec.c
      run: |
        cd android-kernel
        COUNT=$(grep -c "CONFIG_KSU" fs/exec.c || true)
        if [ "$COUNT" -lt 2 ]; then
          echo "!!! GAGAL: fs/exec.c cuma $COUNT/2 blok CONFIG_KSU"
          exit 1
        fi
        echo ">>> OK: fs/exec.c ($COUNT blok)"

    - name: Patch fs/open.c
      run: |
        cd android-kernel
        FILE="fs/open.c"
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *mode, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open1.txt
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_faccessat(&dfd, &filename, &mode, NULL);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open2.txt
        awk -v patchfile="/tmp/patch_open1.txt" '
          /^SYSCALL_DEFINE3\(faccessat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/open_step1.c
        mv /tmp/open_step1.c "$FILE"
        awk -v patchfile="/tmp/patch_open2.txt" '
          { lines[NR] = $0 }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /unsigned int lookup_flags = LOOKUP_FOLLOW;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(mode & ~S_IRWXO\)/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
              }
            }
          }
        ' "$FILE" > /tmp/open_step2.c
        mv /tmp/open_step2.c "$FILE"

    - name: Verify fs/open.c
      run: |
        cd android-kernel
        COUNT=$(grep -c "CONFIG_KSU" fs/open.c || true)
        if [ "$COUNT" -lt 2 ]; then
          echo "!!! GAGAL: fs/open.c cuma $COUNT/2 blok CONFIG_KSU"
          exit 1
        fi
        echo ">>> OK: fs/open.c ($COUNT blok)"

    - name: Patch fs/read_write.c
      run: |
        cd android-kernel
        FILE="fs/read_write.c"
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern bool ksu_vfs_read_hook __read_mostly;'
          printf '%s\n' '__attribute__((cold))'
          printf '%s\n' 'extern int ksu_handle_sys_read(unsigned int fd,'
          printf '%s\n' '                              char __user **buf_ptr, size_t *count_ptr);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw1.txt
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        if (unlikely(ksu_vfs_read_hook))'
          printf '%s\n' '                ksu_handle_sys_read(fd, &buf, &count);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw2.txt
        awk -v patchfile="/tmp/patch_rw1.txt" '
          /^SYSCALL_DEFINE3\(read,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/rw_step1.c
        mv /tmp/rw_step1.c "$FILE"
        awk -v patchfile="/tmp/patch_rw2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE3\(read,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /ssize_t ret = -EBADF;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(f\.file\) \{/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/rw_step2.c
        mv /tmp/rw_step2.c "$FILE"

    - name: Verify fs/read_write.c
      run: |
        cd android-kernel
        COUNT=$(grep -c "CONFIG_KSU" fs/read_write.c || true)
        if [ "$COUNT" -lt 2 ]; then
          echo "!!! GAGAL: fs/read_write.c cuma $COUNT/2 blok CONFIG_KSU"
          exit 1
        fi
        echo ">>> OK: fs/read_write.c ($COUNT blok)"

    - name: Patch fs/stat.c
      run: |
        cd android-kernel
        FILE="fs/stat.c"
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_stat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat1.txt
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_stat(&dfd, &filename, &flag);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat2.txt
        awk -v patchfile="/tmp/patch_stat1.txt" '
          /^SYSCALL_DEFINE4\(newfstatat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/stat_step1.c
        mv /tmp/stat_step1.c "$FILE"
        awk -v patchfile="/tmp/patch_stat2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(newfstatat,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int error;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /error = vfs_fstatat\(dfd, filename, &stat, flag\);/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/stat_step2.c
        mv /tmp/stat_step2.c "$FILE"

    - name: Verify fs/stat.c
      run: |
        cd android-kernel
        COUNT=$(grep -c "CONFIG_KSU" fs/stat.c || true)
        if [ "$COUNT" -lt 2 ]; then
          echo "!!! GAGAL: fs/stat.c cuma $COUNT/2 blok CONFIG_KSU"
          exit 1
        fi
        echo ">>> OK: fs/stat.c ($COUNT blok)"

    - name: Patch kernel/reboot.c
      run: |
        cd android-kernel
        FILE="kernel/reboot.c"
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot1.txt
        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot2.txt
        awk -v patchfile="/tmp/patch_reboot1.txt" '
          /^SYSCALL_DEFINE4\(reboot,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/reboot_step1.c
        mv /tmp/reboot_step1.c "$FILE"
        awk -v patchfile="/tmp/patch_reboot2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(reboot,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int ret = 0;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /We only trust the superuser/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/reboot_step2.c
        mv /tmp/reboot_step2.c "$FILE"

    - name: Verify kernel/reboot.c
      run: |
        cd android-kernel
        COUNT=$(grep -c "CONFIG_KSU" kernel/reboot.c || true)
        if [ "$COUNT" -lt 2 ]; then
          echo "!!! GAGAL: kernel/reboot.c cuma $COUNT/2 blok CONFIG_KSU"
          exit 1
        fi
        echo ">>> OK: kernel/reboot.c ($COUNT blok)"

    - name: Summary
      run: |
        echo "=== SEMUA PATCH BERHASIL ==="
        echo "Source: ${{ env.KERNEL_SOURCE }} (${{ env.KERNEL_SOURCE_BRANCH }})"
        echo "SukiSU branch: susfs-main"
