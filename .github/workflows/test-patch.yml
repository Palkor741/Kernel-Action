name: Test Patch exec.c

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Patch fs/exec.c
    runs-on: ubuntu-22.04

    steps:
    - name: Clone kernel source (shallow)
      run: |
        git clone https://github.com/LineageOS/android_kernel_xiaomi_mt6768.git -b lineage-20 android-kernel --depth=1

    - name: Show original fs/exec.c relevant section
      run: |
        cd android-kernel
        echo "=== Baris sekitar do_execve (SEBELUM patch) ==="
        grep -n -A 5 -B 5 "^int do_execve" fs/exec.c
        echo ""
        echo "=== Baris envp (SEBELUM patch) ==="
        grep -n "struct user_arg_ptr envp" fs/exec.c

    - name: Patch fs/exec.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/exec.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,'
          printf '%s\n' '                              void *argv, void *envp, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);'
          printf '%s\n' '#endif'
        } > /tmp/patch2.txt

        awk -v patchfile="/tmp/patch1.txt" '
          /^int do_execve\(struct filename \*filename,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/exec_step1.c
        mv /tmp/exec_step1.c "$FILE"

        awk -v patchfile="/tmp/patch2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};/ &&
                  lines[i+1] ~ /struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};/ &&
                  lines[i+2] ~ /return do_execveat_common/) {
                print lines[i+1]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                i++
              }
            }
          }
        ' "$FILE" > /tmp/exec_step2.c
        mv /tmp/exec_step2.c "$FILE"

    - name: Show patched fs/exec.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU (SETELAH patch) ==="
        grep -n -B 3 -A 3 "KSU" fs/exec.c

    - name: Show original fs/open.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE3 faccessat ==="
        grep -n -B 3 -A 15 "SYSCALL_DEFINE3(faccessat" fs/open.c 

    - name: Patch fs/open.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/open.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *mode, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_faccessat(&dfd, &filename, &mode, NULL);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open2.txt

        awk -v patchfile="/tmp/patch_open1.txt" '
          /^SYSCALL_DEFINE3\(faccessat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/open_step1.c
        mv /tmp/open_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_open2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /unsigned int lookup_flags = LOOKUP_FOLLOW;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(mode & ~S_IRWXO\)/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
              }
            }
          }
        ' "$FILE" > /tmp/open_step2.c
        mv /tmp/open_step2.c "$FILE"

    - name: Show patched fs/open.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di open.c (SETELAH patch) ==="
        grep -n -B 3 -A 3 "KSU" fs/open.c   

    - name: Show original fs/read_write.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE3 read ==="
        grep -n -B 5 -A 10 "^SYSCALL_DEFINE3(read," fs/read_write.c 

    - name: Patch fs/read_write.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/read_write.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern bool ksu_vfs_read_hook __read_mostly;'
          printf '%s\n' '__attribute__((cold))'
          printf '%s\n' 'extern int ksu_handle_sys_read(unsigned int fd,'
          printf '%s\n' '                              char __user **buf_ptr, size_t *count_ptr);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        if (unlikely(ksu_vfs_read_hook))'
          printf '%s\n' '                ksu_handle_sys_read(fd, &buf, &count);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw2.txt

        awk -v patchfile="/tmp/patch_rw1.txt" '
          /^SYSCALL_DEFINE3\(read,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/rw_step1.c
        mv /tmp/rw_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_rw2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE3\(read,/ { target_zone = 1 }
          {
            lines[NR] = $0
            zone[NR] = target_zone
          }
          /^\}/ { if (target_zone == 1 && done == 1) target_zone = 0 }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /ssize_t ret = -EBADF;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(f\.file\) \{/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/rw_step2.c
        mv /tmp/rw_step2.c "$FILE"

    - name: Show patched fs/read_write.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di read_write.c (SETELAH patch) ==="
        grep -n -B 3 -A 5 "KSU" fs/read_write.c

    - name: Show original fs/stat.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE4 newfstatat ==="
        grep -n -B 5 -A 10 "^SYSCALL_DEFINE4(newfstatat," fs/stat.c   

    - name: Patch fs/stat.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/stat.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_stat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_stat(&dfd, &filename, &flag);'
          printf '%s\n' '#endif'
        } > /tmp/patch_stat2.txt

        awk -v patchfile="/tmp/patch_stat1.txt" '
          /^SYSCALL_DEFINE4\(newfstatat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/stat_step1.c
        mv /tmp/stat_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_stat2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(newfstatat,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int error;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /error = vfs_fstatat\(dfd, filename, &stat, flag\);/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/stat_step2.c
        mv /tmp/stat_step2.c "$FILE"

    - name: Show patched fs/stat.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di stat.c (SETELAH patch) ==="
        grep -n -B 3 -A 5 "KSU" fs/stat.c    

    - name: Show original kernel/reboot.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE4 reboot ==="
        grep -n -B 5 -A 15 "^SYSCALL_DEFINE4(reboot," kernel/reboot.c   

    - name: Patch kernel/reboot.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="kernel/reboot.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);'
          printf '%s\n' '#endif'
        } > /tmp/patch_reboot2.txt

        awk -v patchfile="/tmp/patch_reboot1.txt" '
          /^SYSCALL_DEFINE4\(reboot,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/reboot_step1.c
        mv /tmp/reboot_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_reboot2.txt" '
          BEGIN { target_zone = 0; done = 0 }
          /^SYSCALL_DEFINE4\(reboot,/ { target_zone = 1 }
          { lines[NR] = $0; zone[NR] = target_zone }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (zone[i] == 1 && done == 0 &&
                  lines[i] ~ /int ret = 0;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /We only trust the superuser/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
              }
            }
          }
        ' "$FILE" > /tmp/reboot_step2.c
        mv /tmp/reboot_step2.c "$FILE"

    - name: Show patched kernel/reboot.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di reboot.c (SETELAH patch) ==="
        grep -n -B 3 -A 5 "KSU" kernel/reboot.c   

    - name: Show original nt36xxx.c probe function end
      run: |
        cd android-kernel
        grep -n -B 2 -A 15 'bTouchIsAwake = 1;' drivers/input/touchscreen/NT36672C/nt36xxx.c   

    - name: Show nvt_ts_probe function signature
      run: |
        cd android-kernel
        grep -n "nvt_ts_probe" drivers/input/touchscreen/NT36672C/nt36xxx.c   

    - name: Patch nt36xxx.c for MediaTek panel touch handle
      run: |
        cd android-kernel
        FILE="drivers/input/touchscreen/NT36672C/nt36xxx.c"

        {
          printf '%s\n' '#ifdef CONFIG_DRM_MEDIATEK'
          printf '%s\n' 'static int nvt_tp_power_on_reinit(void)'
          printf '%s\n' '{'
          printf '%s\n' '        int32_t ret;'
          printf '%s\n' ''
          printf '%s\n' '        pr_info("%s is called\n", __func__);'
          printf '%s\n' ''
          printf '%s\n' '        ret = nvt_ts_suspend(&ts->client->dev);'
          printf '%s\n' '        if (ret) {'
          printf '%s\n' '                pr_info("%s  is called suspend %d\n", __func__, ret);'
          printf '%s\n' '                return ret;'
          printf '%s\n' '        }'
          printf '%s\n' ''
          printf '%s\n' '        ret = nvt_ts_resume(&ts->client->dev);'
          printf '%s\n' '        if (ret)'
          printf '%s\n' '                pr_info("%s  is called resume %d\n", __func__, ret);'
          printf '%s\n' ''
          printf '%s\n' '        return ret;'
          printf '%s\n' '}'
          printf '%s\n' '#endif'
        } > /tmp/patch_touch_func.txt

        {
          printf '%s\n' '#ifdef CONFIG_DRM_MEDIATEK'
          printf '%s\n' '        pr_info("%s, disp notifier register func!\n", __func__);'
          printf '%s\n' '        if (mtk_panel_tch_handle_init()) {'
          printf '%s\n' '                void **retval = mtk_panel_tch_handle_init();'
          printf '%s\n' '                *retval = (void *)nvt_tp_power_on_reinit;'
          printf '%s\n' '        }'
          printf '%s\n' '#endif'
        } > /tmp/patch_touch_reg.txt

        awk -v patchfile="/tmp/patch_touch_func.txt" '
          /^static int32_t nvt_ts_probe\(struct spi_device \*client\)/ {
            while ((getline line < patchfile) > 0) print line
            print ""
          }
          { print }
        ' "$FILE" > /tmp/touch_step1.c
        mv /tmp/touch_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_touch_reg.txt" '
          BEGIN { done = 0 }
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (done == 0 &&
                  lines[i] ~ /bTouchIsAwake = 1;/ &&
                  lines[i+1] ~ /NVT_LOG\("end\\n"\);/ &&
                  lines[i+2] ~ /^$/ &&
                  lines[i+3] ~ /nvt_irq_enable\(true\);/) {
                print lines[i+1]
                print lines[i+2]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                done = 1
                i += 2
              }
            }
          }
        ' "$FILE" > /tmp/touch_step2.c
        mv /tmp/touch_step2.c "$FILE"

    - name: Show patched nt36xxx.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep MEDIATEK di nt36xxx.c (SETELAH patch) ==="
        grep -n -B 3 -A 10 "CONFIG_DRM_MEDIATEK" drivers/input/touchscreen/NT36672C/nt36xxx.c 

    - name: Inspect Resume, IRQ, and ESD in nt36xxx.c
      run: |
        cd android-kernel
        FILE="drivers/input/touchscreen/NT36672C/nt36xxx.c"
        
        echo "=== 1. FUNGSI NVT_TS_RESUME ==="
        grep -n -A 30 "static int32_t nvt_ts_resume" $FILE || grep -n -A 30 "nvt_ts_resume" $FILE

        echo "=== 2. FUNGSI NVT_TS_SUSPEND ==="
        grep -n -A 30 "static int32_t nvt_ts_suspend" $FILE || grep -n -A 30 "nvt_ts_suspend" $FILE

        echo "=== 3. PENANGANAN ESD WORKQUEUE ==="
        grep -n -B 5 -A 25 "esd" $FILE || grep -n -B 5 -A 25 "ESD" $FILE

        echo "=== 4. LIST FILE DALAM FOLDER TOUCH DRIVER ==="
        ls -la drivers/input/touchscreen/NT36672C/

        - name: Disable ESD Check and Fix Touch Freeze
      run: |
        python3 - << 'EOF'
        import os, re, glob

        # 1. Cari file nt36xxx.h untuk matikan NVT_TOUCH_ESD_PROTECT
        header_matches = glob.glob("**/drivers/input/touchscreen/NT36672C/nt36xxx.h", recursive=True)
        if header_matches:
            h_file = header_matches[0]
            with open(h_file, "r") as f:
                h_code = f.read()
            # Ubah NVT_TOUCH_ESD_PROTECT dari 1 jadi 0
            h_code_updated = re.sub(r'#define\s+NVT_TOUCH_ESD_PROTECT\s+1', '#define NVT_TOUCH_ESD_PROTECT 0', h_code)
            with open(h_file, "w") as f:
                f.write(h_code_updated)
            print("ESD Protection berhasil di-DISABLE di nt36xxx.h!")

        # 2. Patch nt36xxx.c untuk memastikan resume stabil
        c_matches = glob.glob("**/drivers/input/touchscreen/NT36672C/nt36xxx.c", recursive=True)
        if c_matches:
            c_file = c_matches[0]
            with open(c_file, "r") as f:
                c_code = f.read()

            # Matikan pemanggilan ESD work di dalam c file secara eksplisit jika ada
            c_code_updated = re.sub(r'#define\s+NVT_TOUCH_ESD_PROTECT\s+1', '#define NVT_TOUCH_ESD_PROTECT 0', c_code)

            with open(c_file, "w") as f:
                f.write(c_code_updated)
            print("Eksplisit ESD Disable diterapkan di nt36xxx.c!")

        EOF
        
        
        
        
        

    - name: Show patched nvt_ts_resume section
      run: |
        cd android-kernel
        echo "=== Hasil nvt_ts_resume SETELAH Patch ==="
        grep -n -A 35 "static int32_t nvt_ts_resume" drivers/input/touchscreen/NT36672C/nt36xxx.c
        
    
        
