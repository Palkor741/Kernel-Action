name: Test Patch exec.c

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Patch fs/exec.c
    runs-on: ubuntu-22.04

    steps:
    - name: Clone kernel source (shallow)
      run: |
        git clone https://github.com/LineageOS/android_kernel_xiaomi_mt6768.git -b lineage-20 android-kernel --depth=1

    - name: Show original fs/exec.c relevant section
      run: |
        cd android-kernel
        echo "=== Baris sekitar do_execve (SEBELUM patch) ==="
        grep -n -A 5 -B 5 "^int do_execve" fs/exec.c
        echo ""
        echo "=== Baris envp (SEBELUM patch) ==="
        grep -n "struct user_arg_ptr envp" fs/exec.c

    - name: Patch fs/exec.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/exec.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,'
          printf '%s\n' '                              void *argv, void *envp, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);'
          printf '%s\n' '#endif'
        } > /tmp/patch2.txt

        awk -v patchfile="/tmp/patch1.txt" '
          /^int do_execve\(struct filename \*filename,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/exec_step1.c
        mv /tmp/exec_step1.c "$FILE"

        awk -v patchfile="/tmp/patch2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};/ &&
                  lines[i+1] ~ /struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};/ &&
                  lines[i+2] ~ /return do_execveat_common/) {
                print lines[i+1]
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
                i++
              }
            }
          }
        ' "$FILE" > /tmp/exec_step2.c
        mv /tmp/exec_step2.c "$FILE"

    - name: Show patched fs/exec.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU (SETELAH patch) ==="
        grep -n -B 3 -A 3 "KSU" fs/exec.c

    - name: Show original fs/open.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE3 faccessat ==="
        grep -n -B 3 -A 15 "SYSCALL_DEFINE3(faccessat" fs/open.c 

    - name: Patch fs/open.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/open.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '__attribute__((hot))'
          printf '%s\n' 'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,'
          printf '%s\n' '                              int *mode, int *flags);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        ksu_handle_faccessat(&dfd, &filename, &mode, NULL);'
          printf '%s\n' '#endif'
        } > /tmp/patch_open2.txt

        awk -v patchfile="/tmp/patch_open1.txt" '
          /^SYSCALL_DEFINE3\(faccessat,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/open_step1.c
        mv /tmp/open_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_open2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /unsigned int lookup_flags = LOOKUP_FOLLOW;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(mode & ~S_IRWXO\)/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
              }
            }
          }
        ' "$FILE" > /tmp/open_step2.c
        mv /tmp/open_step2.c "$FILE"

    - name: Show patched fs/open.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di open.c (SETELAH patch) ==="
        grep -n -B 3 -A 3 "KSU" fs/open.c   

    - name: Show original fs/read_write.c relevant section
      run: |
        cd android-kernel
        echo "=== Cari SYSCALL_DEFINE3 read ==="
        grep -n -B 5 -A 10 "^SYSCALL_DEFINE3(read," fs/read_write.c 

    - name: Patch fs/read_write.c for KernelSU-Next
      run: |
        cd android-kernel
        FILE="fs/read_write.c"

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' 'extern bool ksu_vfs_read_hook __read_mostly;'
          printf '%s\n' '__attribute__((cold))'
          printf '%s\n' 'extern int ksu_handle_sys_read(unsigned int fd,'
          printf '%s\n' '                              char __user **buf_ptr, size_t *count_ptr);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw1.txt

        {
          printf '%s\n' '#ifdef CONFIG_KSU'
          printf '%s\n' '        if (unlikely(ksu_vfs_read_hook))'
          printf '%s\n' '                ksu_handle_sys_read(fd, &buf, &count);'
          printf '%s\n' '#endif'
        } > /tmp/patch_rw2.txt

        awk -v patchfile="/tmp/patch_rw1.txt" '
          /^SYSCALL_DEFINE3\(read,/ {
            while ((getline line < patchfile) > 0) print line
            close(patchfile)
          }
          { print }
        ' "$FILE" > /tmp/rw_step1.c
        mv /tmp/rw_step1.c "$FILE"

        awk -v patchfile="/tmp/patch_rw2.txt" '
          {
            lines[NR] = $0
          }
          END {
            for (i = 1; i <= NR; i++) {
              print lines[i]
              if (lines[i] ~ /ssize_t ret = -EBADF;/ &&
                  lines[i+1] ~ /^$/ &&
                  lines[i+2] ~ /if \(f\.file\) \{/) {
                while ((getline line < patchfile) > 0) print line
                close(patchfile)
              }
            }
          }
        ' "$FILE" > /tmp/rw_step2.c
        mv /tmp/rw_step2.c "$FILE"

    - name: Show patched fs/read_write.c relevant section
      run: |
        cd android-kernel
        echo "=== Hasil grep KSU di read_write.c (SETELAH patch) ==="
        grep -n -B 3 -A 5 "KSU" fs/read_write.c   
